<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre Mim | Keven Lino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="sobre">

  <header class="topo">
    <a class="marca" href="index.html">Keven Lino</a>
    <div class="idiomas">
      <button type="button" data-idioma="pt" class="ativo">PT</button>
      <button type="button" data-idioma="en">EN</button>
    </div>
  </header>

  <main>
    <div class="barra">
      <a class="botao" href="index.html" data-i18n="voltar"></a>
      <a class="botao" href="projetos.html" data-i18n="proxima"></a>
    </div>

    <section id="sobre" class="pagina">
      <p class="rotulo"><span data-i18n="carta"></span> 01 / 05</p>
      <h2 data-i18n="nav_sobre"></h2>
      <p class="subtitulo" data-i18n="sobre_sub"></p>

      <div class="sobre">
        <div class="foto" data-i18n="sobre_foto"></div>
        <div>
          <h3 data-i18n="sobre_ola"></h3>
          <p data-i18n="sobre_p1"></p>
          <p data-i18n="sobre_p2"></p>
          <dl class="ficha">
            <dt data-i18n="sobre_formacao"></dt>
            <dd data-i18n="sobre_formacao_v"></dd>
            <dt data-i18n="sobre_local"></dt>
            <dd data-i18n="sobre_local_v"></dd>
            <dt data-i18n="sobre_interesses"></dt>
            <dd data-i18n="sobre_interesses_v"></dd>
          </dl>
        </div>
      </div>
      <p class="aviso" data-i18n="sobre_aviso"></p>
    </section>

    <button id="abrir-baralho" class="botao" type="button" data-i18n="baralho"></button>
  </main>

  <div id="baralho" class="baralho" hidden>
    <div class="baralho-fundo"></div>
    <div class="baralho-painel">
      <p class="rotulo" data-i18n="baralho_aberto"></p>
      <div class="cartas" id="cartas-baralho"></div>
      <button id="fechar-baralho" class="botao" type="button" data-i18n="fechar"></button>
    </div>
  </div>

  <footer class="rodape">
    <span>Portfólio • Keven Lino</span>
    <span data-i18n="rodape_nota"></span>
  </footer>

  <script src="js/textos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
