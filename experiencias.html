<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiências | Keven Lino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="experiencias">

  <header class="topo">
    <a class="marca" href="index.html">Keven Lino</a>
    <div class="idiomas">
      <button type="button" data-idioma="pt" class="ativo">PT</button>
      <button type="button" data-idioma="en">EN</button>
    </div>
  </header>

  <main>
    <div class="barra">
      <a class="botao" href="index.html" data-i18n="voltar"></a>
      <a class="botao" href="habilidades.html" data-i18n="proxima"></a>
    </div>

    <section id="experiencias" class="pagina">
      <p class="rotulo"><span data-i18n="carta"></span> 03 / 05</p>
      <h2 data-i18n="nav_experiencias"></h2>
      <p class="subtitulo" data-i18n="exp_sub"></p>

      <ol class="linha-tempo">
        <li>
          <div class="cabeca">
            <h3 data-i18n="exp1_cargo"></h3>
            <span>20XX — <span data-i18n="exp_atual"></span></span>
          </div>
          <p class="local" data-i18n="exp1_local"></p>
          <p data-i18n="exp1_desc"></p>
        </li>
        <li>
          <div class="cabeca">
            <h3 data-i18n="exp2_cargo"></h3>
            <span>20XX — 20XX</span>
          </div>
          <p class="local" data-i18n="exp2_local"></p>
          <p data-i18n="exp2_desc"></p>
        </li>
        <li>
          <div class="cabeca">
            <h3 data-i18n="exp3_cargo"></h3>
            <span>20XX — 20XX</span>
          </div>
          <p class="local" data-i18n="exp3_local"></p>
          <p data-i18n="exp3_desc"></p>
        </li>
      </ol>
      <p class="aviso" data-i18n="exp_aviso"></p>
    </section>

    <button id="abrir-baralho" class="botao" type="button" data-i18n="baralho"></button>
  </main>

  <div id="baralho" class="baralho" hidden>
    <div class="baralho-fundo"></div>
    <div class="baralho-painel">
      <p class="rotulo" data-i18n="baralho_aberto"></p>
      <div class="cartas" id="cartas-baralho"></div>
      <button id="fechar-baralho" class="botao" type="button" data-i18n="fechar"></button>
    </div>
  </div>

  <footer class="rodape">
    <span>Portfólio • Keven Lino</span>
    <span data-i18n="rodape_nota"></span>
  </footer>

  <script src="js/textos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
