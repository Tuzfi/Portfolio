<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habilidades | Keven Lino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="habilidades">

  <header class="topo">
    <a class="marca" href="index.html">Keven Lino</a>
    <div class="idiomas">
      <button type="button" data-idioma="pt" class="ativo">PT</button>
      <button type="button" data-idioma="en">EN</button>
    </div>
  </header>

  <main>
    <div class="barra">
      <a class="botao" href="index.html" data-i18n="voltar"></a>
      <a class="botao" href="contato.html" data-i18n="proxima"></a>
    </div>

    <section id="habilidades" class="pagina">
      <p class="rotulo"><span data-i18n="carta"></span> 04 / 05</p>
      <h2 data-i18n="nav_habilidades"></h2>
      <p class="subtitulo" data-i18n="hab_sub"></p>

      <div class="grade-habilidades">
        <div class="grupo">
          <h3 data-i18n="hab_linguagens"></h3>
          <p data-i18n="hab_linguagens_d"></p>
          <ul class="tags"><li>JavaScript</li><li>TypeScript</li><li>Python</li><li>Java</li></ul>
        </div>
        <div class="grupo">
          <h3>Frameworks</h3>
          <p data-i18n="hab_frameworks_d"></p>
          <ul class="tags"><li>React</li><li>Next.js</li><li>Express</li><li>Tailwind CSS</li></ul>
        </div>
        <div class="grupo">
          <h3 data-i18n="hab_ferramentas"></h3>
          <p data-i18n="hab_ferramentas_d"></p>
          <ul class="tags"><li>Git</li><li>GitHub</li><li>VS Code</li><li>Figma</li></ul>
        </div>
        <div class="grupo">
          <h3>Soft skills</h3>
          <p data-i18n="hab_soft_d"></p>
          <ul class="tags">
            <li data-i18n="hab_comunicacao"></li>
            <li data-i18n="hab_colaboracao"></li>
            <li data-i18n="hab_organizacao"></li>
          </ul>
        </div>
      </div>
      <p class="aviso" data-i18n="hab_aviso"></p>
    </section>

    <button id="abrir-baralho" class="botao" type="button" data-i18n="baralho"></button>
  </main>

  <div id="baralho" class="baralho" hidden>
    <div class="baralho-fundo"></div>
    <div class="baralho-painel">
      <p class="rotulo" data-i18n="baralho_aberto"></p>
      <div class="cartas" id="cartas-baralho"></div>
      <button id="fechar-baralho" class="botao" type="button" data-i18n="fechar"></button>
    </div>
  </div>

  <footer class="rodape">
    <span>Portfólio • Keven Lino</span>
    <span data-i18n="rodape_nota"></span>
  </footer>

  <script src="js/textos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
