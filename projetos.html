<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos | Keven Lino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="projetos">

  <header class="topo">
    <a class="marca" href="index.html">Keven Lino</a>
    <div class="idiomas">
      <button type="button" data-idioma="pt" class="ativo">PT</button>
      <button type="button" data-idioma="en">EN</button>
    </div>
  </header>

  <main>
    <div class="barra">
      <a class="botao" href="index.html" data-i18n="voltar"></a>
      <a class="botao" href="experiencias.html" data-i18n="proxima"></a>
    </div>

    <section id="projetos" class="pagina">
      <p class="rotulo"><span data-i18n="carta"></span> 02 / 05</p>
      <h2 data-i18n="nav_projetos"></h2>
      <p class="subtitulo" data-i18n="proj_sub"></p>

      <div class="grade-projetos">
        <article class="projeto">
          <div class="imagem" data-i18n="proj_imagem"></div>
          <h3>Organizador de estudos</h3>
          <p data-i18n="proj1_desc"></p>
          <ul class="tags"><li>React</li><li>TypeScript</li></ul>
          <div class="links">
            <a href="#" data-i18n="proj_codigo"></a>
            <a href="#" data-i18n="proj_demo"></a>
          </div>
        </article>

        <article class="projeto">
          <div class="imagem" data-i18n="proj_imagem"></div>
          <h3>Catálogo de livros</h3>
          <p data-i18n="proj2_desc"></p>
          <ul class="tags"><li>JavaScript</li><li>CSS</li></ul>
          <div class="links">
            <a href="#" data-i18n="proj_codigo"></a>
            <a href="#" data-i18n="proj_demo"></a>
          </div>
        </article>

        <article class="projeto">
          <div class="imagem" data-i18n="proj_imagem"></div>
          <h3>Painel de finanças</h3>
          <p data-i18n="proj3_desc"></p>
          <ul class="tags"><li>React</li><li>Node.js</li></ul>
          <div class="links">
            <a href="#" data-i18n="proj_codigo"></a>
            <a href="#" data-i18n="proj_demo"></a>
          </div>
        </article>
      </div>
      <p class="aviso" data-i18n="proj_aviso"></p>
    </section>

    <button id="abrir-baralho" class="botao" type="button" data-i18n="baralho"></button>
  </main>

  <div id="baralho" class="baralho" hidden>
    <div class="baralho-fundo"></div>
    <div class="baralho-painel">
      <p class="rotulo" data-i18n="baralho_aberto"></p>
      <div class="cartas" id="cartas-baralho"></div>
      <button id="fechar-baralho" class="botao" type="button" data-i18n="fechar"></button>
    </div>
  </div>

  <footer class="rodape">
    <span>Portfólio • Keven Lino</span>
    <span data-i18n="rodape_nota"></span>
  </footer>

  <script src="js/textos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
